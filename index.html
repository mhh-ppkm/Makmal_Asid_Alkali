<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makmal Asid dan Alkali</title>
<meta name="theme-color" content="#2f3237">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asid Alkali">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fbfaf7; --ink2:rgba(251,250,247,.76); --ink3:rgba(251,250,247,.55);
  --glass:rgba(32,35,41,.58); --glass-hi:rgba(255,255,255,.12); --line:rgba(255,255,255,.18);
  --amber:#f4a23a; --acid:#e5484d; --neutral:#30a46c; --alkali:#3e63dd;
  --wall1:#e6e2da; --wall2:#cfc9be; --floor:#aca498; --win:#fffaf0; --curtain:#a9c4b8;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall1:#3b3a37;--wall2:#2d2c2a;--floor:#22211f;--win:#8a8579;--curtain:#4c5d55;--glass:rgba(20,21,25,.66);color-scheme:dark}}
:root[data-theme="dark"]{--wall1:#3b3a37;--wall2:#2d2c2a;--floor:#22211f;--win:#8a8579;--curtain:#4c5d55;--glass:rgba(20,21,25,.66);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--wall2);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--wall1) 0%,var(--wall2) 62%,var(--floor) 100%);overflow:hidden}
#bg .board{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:44%;height:30%;background:#2f4a3f;border:10px solid #8a6a46;border-radius:6px;opacity:.55}
#bg .win{position:absolute;right:6%;top:12%;width:16%;height:46%;background:linear-gradient(180deg,var(--win),rgba(255,255,255,.15));border-radius:3px;filter:blur(1.5px);opacity:.8}
#bg .cur{position:absolute;top:9%;right:21%;width:5%;height:56%;background:var(--curtain);opacity:.5;border-radius:2px}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
#cam.mirror{transform:scaleX(-1)}
body.cam #cam{opacity:1}
body.cam #bg .board,body.cam #bg .win,body.cam #bg .cur{display:none}
#stage{position:fixed;inset:0;z-index:1}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#hands{position:fixed;inset:0;z-index:9;pointer-events:none;width:100%;height:100%}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:13px;line-height:1.15;padding:6px 11px;border-radius:14px;background:rgba(18,19,23,.78);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.lab b{font-weight:900;font-size:14px}
.lab span{color:rgba(255,255,255,.78)}
.lab.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(244,162,58,.45)}
.lab .ph{font-weight:900;padding:1px 8px;border-radius:999px;color:#fff}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.18)}
header.top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:8px 10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;flex-wrap:wrap;pointer-events:none}
header.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{background:#fff;border-radius:12px;padding:5px 8px;display:flex;flex:0 0 auto;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.logo img{height:32px;width:auto;display:block}
.ttl{min-width:0;padding:6px 13px;border-radius:16px}
.ttl h1{font-size:18px;font-weight:900;margin:0;white-space:nowrap}
.ttl p{font-size:12px;margin:0;color:var(--ink2);white-space:nowrap;font-weight:700}
.hbtn{border-radius:999px;padding:10px 15px;cursor:pointer;font-weight:800;font-size:15px;white-space:nowrap;display:flex;gap:8px;align-items:center;min-height:44px}
.hbtn[hidden]{display:none}
.hbtn.on{background:#fff;color:#17181c}
#camBtn i{width:9px;height:9px;border-radius:50%;background:#9aa0a8}
body.tracking #camBtn i{background:#5be08f;box-shadow:0 0 0 4px rgba(91,224,143,.25)}
.seg{display:flex;padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:900;font-size:14px;min-height:36px}
.seg button.on{background:#fff;color:#17181c}

#panel{position:fixed;z-index:5;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(1000px,calc(100% - 16px));border-radius:28px;padding:12px 16px 12px}
.prow{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.steps{display:flex;gap:6px}
.step{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:800;font-size:14px;color:var(--ink3);white-space:nowrap}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:rgba(255,255,255,.12);font-size:13px}
.step.on{color:#fff;background:rgba(244,162,58,.22)}
.step.on i{background:var(--amber);color:#1a1a1a}
.step.ok i{background:var(--neutral);color:#fff}
.bks{display:flex;gap:6px;margin-left:auto}
.bk{border:0;border-radius:14px;padding:6px 12px;background:var(--glass-hi);cursor:pointer;font-weight:900;font-size:14px;min-height:40px;white-space:nowrap}
.bk.on{background:var(--amber);color:#1a1a1a}
#inst{margin:10px 2px 10px;font-size:19px;line-height:1.4;font-weight:800;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
#inst small{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-top:3px;text-align:justify}
#acts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#acts::-webkit-scrollbar{display:none}
.act{border:0;border-radius:18px;padding:11px 16px;background:var(--glass-hi);cursor:pointer;font-weight:900;font-size:16px;white-space:nowrap;flex:0 0 auto;min-height:50px;display:flex;align-items:center;gap:8px}
.act:hover{background:rgba(255,255,255,.2)}
.act .sw{width:14px;height:22px;border-radius:3px;flex:0 0 auto}
.act.big{font-size:20px;padding:12px 26px;min-height:58px;color:#fff}
.act.acid{background:var(--acid)} .act.neutral{background:var(--neutral)} .act.alkali{background:var(--alkali)}
.act.ghost{background:transparent;border:1px solid var(--line)}
.act[disabled]{opacity:.4;cursor:default}
.foot{margin-top:8px;font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-weight:700}

#teacher{position:fixed;z-index:6;right:12px;top:calc(76px + env(safe-area-inset-top,0px));width:min(380px,calc(100% - 24px));max-height:calc(100% - 330px - env(safe-area-inset-top,0px));overflow:auto;border-radius:24px;padding:14px 16px;display:none}
#teacher.show{display:block}
#teacher h2{font-size:19px;margin:0 0 8px;font-weight:900}
#teacher h3{font-size:14px;margin:14px 0 6px;color:var(--ink2);font-weight:800}
#teacher input[type=text]{width:100%;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);padding:10px 12px;font-weight:800;font-size:15px;min-height:44px}
#teacher input::placeholder{color:var(--ink3)}
.trow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tb{border:0;border-radius:14px;padding:10px 14px;background:var(--glass-hi);cursor:pointer;font-weight:900;font-size:15px;min-height:44px;white-space:nowrap}
.tb.pri{background:var(--amber);color:#1a1a1a}
.tb.on{background:#fff;color:#17181c}
#chal{margin-top:10px;padding:12px;border-radius:16px;background:rgba(244,162,58,.16);border:1px solid rgba(244,162,58,.4);font-weight:800;font-size:16px;line-height:1.4;text-align:justify;display:none}
#chal.show{display:block}
#score{font-weight:900;font-size:16px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:justify;vertical-align:middle}
th{font-weight:800;color:var(--ink2);font-size:12px;text-align:left;white-space:nowrap}
td:first-child{font-weight:800}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:900;color:#fff;font-size:12.5px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:16px;border-radius:2px;vertical-align:-3px;margin-right:5px}
.empty{color:var(--ink3);font-weight:700;text-align:justify}

#toast{position:fixed;z-index:8;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(600px,calc(100% - 24px));padding:12px 18px;border-radius:18px;font-size:16px;font-weight:800;line-height:1.4;text-align:justify;opacity:0;transition:opacity .35s;pointer-events:none}
#toast.show{opacity:1}

@media (max-width:760px){
  header.top{gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
  .logo img{height:24px}
  .ttl{padding:4px 10px}
  .ttl h1{font-size:15px} .ttl p{font-size:11px}
  .hbtn{padding:7px 11px;font-size:13px;min-height:38px}
  .seg button{padding:5px 9px;font-size:12.5px;min-height:30px}
  #panel{width:calc(100% - 10px);bottom:calc(5px + env(safe-area-inset-bottom,0px));padding:10px 10px;border-radius:22px}
  .step{font-size:12.5px;padding:4px 9px 4px 4px} .step i{width:22px;height:22px;font-size:12px}
  .bks{margin-left:0}
  .bk{padding:5px 10px;font-size:13px;min-height:36px}
  #inst{font-size:16px;margin:8px 2px} #inst small{font-size:13px}
  .act{font-size:14.5px;padding:9px 13px;min-height:46px}
  .act.big{font-size:17px;padding:10px 18px;min-height:52px}
  #teacher{left:6px;right:6px;width:auto;top:calc(112px + env(safe-area-inset-top,0px));max-height:44vh}
  #toast{top:calc(116px + env(safe-area-inset-top,0px));font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){#toast,#cam{transition:none}}
</style>
</head>

/* label textures */
function labelTex(s,show){
  const c=document.createElement('canvas');c.width=320;c.height=240;const g=c.getContext('2d');
  g.fillStyle='#fbf8f0';g.fillRect(0,0,320,240);
  g.fillStyle=show?TYPE_COL[s.type]:'#9aa0a8';g.fillRect(0,0,320,44);
  g.fillStyle='#fff';g.font='900 28px Nunito, Arial';g.textAlign='center';g.textBaseline='middle';
  g.fillText(show?W[LG][s.type]:(LG==='bm'?'Bahan':'Substance'),160,23);
  g.fillStyle='#1c1d21';const words=NAME(s).split(' ');const lines=[];let cur='';let fs=44;g.font=`900 ${fs}px Nunito, Arial`;
  for(const w of words){const tst=cur?cur+' '+w:w;if(g.measureText(tst).width>290&&cur){lines.push(cur);cur=w}else cur=tst}lines.push(cur);
  while(lines.some(l=>g.measureText(l).width>300)&&fs>26){fs-=2;g.font=`900 ${fs}px Nunito, Arial`}
  const lh=fs*1.1,y0=142-(lines.length-1)*lh/2;lines.forEach((l,i)=>g.fillText(l,160,y0+i*lh));
  const tx=new THREE.CanvasTexture(c);tx.encoding=THREE.sRGBEncoding;tx.anisotropy=4;return tx;
}

async function pour(bi,from){
  const B=beakers[bi],bt=bottles[from];const s=bt.s;
  if(B.sub){toast(t('full'));say(t('full'));sendHome(bt);return}
  busy=true;select(bi);
  const start=bt.g.position.clone(),above=V(B.x-.75,1.62,B.z);
  await wait(.55,k=>bt.g.position.lerpVectors(start,above,ease(k)));
  await wait(.4,k=>bt.g.rotation.z=-1.95*ease(k));
  B.sub=s.id;B.lmat.color.set(s.color);B.lmat.opacity=s.op;B.liq.visible=true;stream.material.color.set(s.color);stream.visible=true;
  await wait(1.2,k=>{B.level=.6*k;B.liq.scale.y=Math.max(.001,B.level);const m=bt.g.localToWorld(V(0,1.0,0));setStream(m,V(B.x+.05,B.level+.02,B.z))});
  stream.visible=false;
  if(s.foam){B.foam.visible=true;B.foam.position.y=B.level+.03}
  await wait(.35,k=>bt.g.rotation.z=-1.95*(1-ease(k)));
  await wait(.55,k=>bt.g.position.lerpVectors(above,bt.home,ease(k)));
  busy=false;refresh();
  if(challenge&&challenge.id!==s.id)toast(LG==='bm'?`Cabaran ialah ${NAME(SUBS.find(x=>x.id===challenge.id)).toLowerCase()}. Bahan ini pun boleh diuji.`:`The challenge is the ${NAME(SUBS.find(x=>x.id===challenge.id)).toLowerCase()}. This one can be tested too.`);
  say(B.blue||B.red?'':t('i2')(nm(s)));
}

$('#instBtn').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#instBtn').hidden=true}
  else if(isIOS)toast(LG==='bm'?'Di iPad atau iPhone: tekan butang Kongsi dalam Safari, kemudian Tambah ke Skrin Utama.':'On iPad or iPhone: tap Share in Safari, then Add to Home Screen.')};
addEventListener('appinstalled',()=>$('#instBtn').hidden=true);

/* ------------------------------ TOAST / CAMERA FIT / LOOP ------------------------------ */
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),5200)}
function fit(){renderer.setSize(innerWidth,innerHeight,false);const a=innerWidth/innerHeight;camera.fov=a<1?52:38;camera.aspect=a;camera.updateProjectionMatrix();
  const hf=2*Math.atan(Math.tan(camera.fov*Math.PI/360)*a);
  const d=clamp((BW/2+.25)/Math.tan(hf/2)*(a<1?1.05:1.32),6,30);
  controls.target.set(0,a<1?-.7:-.55,.3);const dir=V(0,.85,1).normalize();camera.position.copy(controls.target).addScaledVector(dir,d);
  controls.minDistance=d*.5;controls.maxDistance=d*1.3;controls.update()}
addEventListener('resize',fit);
const clock=new THREE.Clock();
function loop(){const dt=Math.min(clock.getDelta(),.05),tm=clock.elapsedTime;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.d);w.f(k);if(k>=1){tweens.splice(i,1);w.r()}}
  beakers.forEach(b=>{if(b.ring.visible)b.ring.material.opacity=.55+.4*Math.sin(tm*4);
    const s=b.sub&&SUBS.find(x=>x.id===b.sub);if(s&&s.fizz&&b.level>.3){const m=new THREE.Matrix4();b.bubs.forEach((p,k)=>{p.y+=p.v*dt;if(p.y>b.level)p.y=0;m.makeTranslation(p.x*.6,p.y+.02,p.z*.6);b.bub.setMatrixAt(k,m)});b.bub.count=40;b.bub.instanceMatrix.needsUpdate=true}else b.bub.count=0;
    if(s&&s.foam)b.foam.position.y=b.level+.03});
  bottles.forEach(bt=>{bt.cap.material.emissive.setHex(challenge&&bt.s.id===challenge.id?(Math.sin(tm*6)>0?0xf4a23a:0x000000):0)});
  for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.life-=dt;const p=c.pts.geometry.attributes.position;c.vel.forEach((v,k)=>{v.y-=4*dt;p.setXYZ(k,p.getX(k)+v.x*dt,Math.max(.03,p.getY(k)+v.y*dt),p.getZ(k)+v.z*dt)});p.needsUpdate=true;c.pts.material.opacity=c.life;c.pts.material.transparent=true;if(c.life<=0){scene.remove(c.pts);confetti.splice(i,1)}}
  if(!HS.some(s=>s.mode==='orbit'))controls.update();
  renderer.render(scene,camera);updateLabels();drawHands();requestAnimationFrame(loop)}
fit();setLang('bm');select(0);loop();
let wantH=false;try{wantH=localStorage.getItem('aa-hands')==='on'}catch(e){}
if(wantH&&navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:'camera'}).then(p=>{if(p.state==='granted')startTracking();else toast(t('hello'))}).catch(()=>toast(t('hello')));
else setTimeout(()=>toast(t('hello')),700);
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
</script>
